[project]
name = "tj103-labels"
version = "0.1.0"
description = "Local wedding guest label printing with Datastar"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.128,<1", "uvicorn>=0.40,<1", "jinja2>=3.1,<4", "reportlab>=4.4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pypdf>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
